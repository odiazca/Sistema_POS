<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#5b5ef4"><title>Sin conexión</title>
<style>*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;background:linear-gradient(135deg,#5b5ef4,#8b5cf6);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#0f172a;padding:20px}
.c{background:#fff;border-radius:24px;padding:34px 28px;max-width:380px;text-align:center;box-shadow:0 30px 60px -20px rgba(0,0,0,.4)}
.i{width:72px;height:72px;border-radius:20px;background:#eef0ff;color:#5b5ef4;display:grid;place-items:center;margin:0 auto 16px;font-size:34px}
h1{font-size:1.3rem;margin:0 0 8px}p{color:#64748b;font-size:.92rem;line-height:1.5;margin:0 0 20px}
button{border:0;border-radius:14px;padding:13px 22px;font-weight:700;font-size:1rem;color:#fff;background:linear-gradient(135deg,#5b5ef4,#8b5cf6);width:100%}</style></head>
<body><div class="c"><div class="i">&#128246;</div><h1>Sin conexión</h1><p>No se pudo conectar con el sistema. Revisa el WiFi o los datos móviles; las ventas no se registran hasta que vuelva la conexión.</p><button onclick="location.reload()">Reintentar</button></div>
<script>addEventListener('online',()=>location.reload())</script></body></html>
